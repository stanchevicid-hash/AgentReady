<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgentReady</title>
<meta name="description" content="Measure, fix and prove how well AI coding agents work in your repo, and verify code an AI wrote.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B2335" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AgentReady">
<style>
:root{
  --paper:#EDF0F2; --sheet:#FFFFFF; --ink:#18213A; --ink-2:#4A5570; --ink-3:#5E6A80; --rule:#D3D9E0;
  --grid:rgba(24,33,58,.05);
  --base:#8C96AA; --imp:#2F5BEA; --imp-soft:#E3EAFD;
  --ok:#176F47; --ok-soft:#DDF2E7; --bad:#B4233C; --bad-soft:#F8E1E5; --warn:#8A5A10; --warn-soft:#F6ECD9;
  --a-read:#7C93C8; --a-search:#9C7CC8; --a-run:#C8A14A; --a-edit:#2F5BEA; --a-err:#B4233C;
  --display:"Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, system-ui, sans-serif;
  --body:"Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, system-ui, sans-serif;
  --mono:ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Roboto Mono", monospace;
  --nav-h:64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141A29; --sheet:#1B2335; --ink:#E6EAF3; --ink-2:#B3BCD0; --ink-3:#8590A8; --rule:#2C3650;
    --grid:rgba(230,234,243,.04); --imp:#8AA2FF; --imp-soft:#24305A; --ok:#3CC384; --ok-soft:#173B2C;
    --bad:#FF8597; --bad-soft:#40212A; --warn:#E0A84A; --warn-soft:#3A2E17; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141A29; --sheet:#1B2335; --ink:#E6EAF3; --ink-2:#B3BCD0; --ink-3:#8590A8; --rule:#2C3650;
  --grid:rgba(230,234,243,.04); --imp:#8AA2FF; --imp-soft:#24305A; --ok:#3CC384; --ok-soft:#173B2C;
  --bad:#FF8597; --bad-soft:#40212A; --warn:#E0A84A; --warn-soft:#3A2E17; color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;-webkit-text-size-adjust:100%}
a{color:var(--imp)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--imp);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- shell: sidebar on PC, bottom tab bar on phone ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav.side{position:sticky;top:0;height:100vh;padding:22px 14px;background:#141B30;color:#C9D1E4;display:flex;flex-direction:column;gap:4px}
.mark{font:700 21px/1 var(--display);letter-spacing:-.02em;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px;padding:4px 10px 22px}
nav.side .mark{color:#fff}
.mark svg{display:block}
.navlink{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;text-decoration:none;color:#AEB8D0;font-weight:500;transition:background .15s,color .15s}
.navlink:hover{background:rgba(255,255,255,.06);color:#fff}
.navlink[aria-current="page"]{background:linear-gradient(135deg,#2F5BEA,#5B7CF0);color:#fff;box-shadow:0 6px 18px -8px #2F5BEA}
.navfoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.08)}
.navfoot .who{font-size:13px;color:#fff;font-weight:600;display:flex;align-items:center;gap:8px}
.navfoot .who small{display:block;font-weight:400;color:#8C96AA}
.navfoot .chip{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);color:#C9D1E4}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#2F5BEA,#1E8A5A);color:#fff;font:700 13px var(--display);flex:none}
main.content{min-width:0;padding:0 28px 60px}
.wrap{max-width:1120px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:10px;padding:20px 0 6px;flex-wrap:wrap}
.topbar h1{flex:1;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--sheet);border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap}
.chip.ok::before,.chip.bad::before,.chip.warn::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--ok)}
.chip.bad::before{background:var(--bad)} .chip.warn::before{background:var(--warn)}
button.chip{cursor:pointer;font-weight:600;color:var(--ink)}
.mobilehead{display:none}
nav.tabs{display:none}

.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;box-shadow:0 1px 2px rgba(24,33,58,.04),0 10px 28px -18px rgba(24,33,58,.25)}
.pagehero{position:relative;overflow:hidden;margin:16px 0 18px;padding:24px;border-radius:18px;color:#fff;
  background:radial-gradient(120% 140% at 100% 0%,#3D63F0 0%,rgba(61,99,240,0) 55%),radial-gradient(90% 120% at 0% 100%,#1E8A5A 0%,rgba(30,138,90,0) 50%),#141B30}
.pagehero h1{color:#fff;max-width:22ch}
.pagehero p{margin:8px 0 0;color:#C9D1E4;max-width:56ch}
.pagehero .steps4{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;margin-top:18px}
.pagehero .steps4 div{color:#fff}
.pagehero .steps4 svg.i{color:#9DB3FF}
.pagehero .heroico{position:absolute;right:-20px;bottom:-30px;opacity:.08;width:200px;height:200px;stroke-width:1.2;color:#fff}
/* sign in */
.authwrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.authbrand{background:radial-gradient(120% 120% at 100% 0%,#3D63F0 0%,rgba(61,99,240,0) 55%),radial-gradient(90% 120% at 0% 100%,#1E8A5A 0%,rgba(30,138,90,0) 55%),#141B30;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.authbrand .mark{color:#fff;padding:0}
.authbrand h1{color:#fff;font-size:clamp(30px,3.6vw,46px);max-width:14ch;margin:0 0 14px}
.authbrand p{color:#C9D1E4;max-width:40ch;margin:0}
.authbrand ul{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:12px}
.authbrand li{display:flex;gap:12px;align-items:center;color:#E6EAF3}
.authbrand li svg.i{color:#9DB3FF}
.authform{display:grid;place-items:center;padding:32px 20px}
.authcard{width:100%;max-width:380px;padding:28px}
.authcard h2{font-size:26px;margin-bottom:6px}
.authcard label{display:block;font-size:13px;color:var(--ink-2);margin:14px 0 4px}
.authcard input{width:100%;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.authcard .btn{width:100%;margin-top:18px;padding:14px}
.pairbox{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.devices .dev{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--rule)}
.devices .dev:first-child{border-top:0}
.devices .dev .kind{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--imp-soft);color:var(--imp)}
.devices .sub{font-size:12px;color:var(--ink-3)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 0 3px var(--ok-soft)}
.toast a{color:#9DB3FF;margin-left:8px;font-weight:600}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0}
h1{font-size:clamp(26px,3.4vw,40px);line-height:1.08;font-weight:700}
h2{font-size:21px;font-weight:700}
h3{font-size:16px;font-weight:600}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.mono{font-family:var(--mono);font-size:13px}
.notice{padding:14px 18px;margin:14px 0;border-left:4px solid var(--warn)}
.notice b{display:block;margin-bottom:4px}
.notice ol{margin:6px 0 0;padding-left:20px;font-size:14px;color:var(--ink-2)}
code{font-family:var(--mono);font-size:12.5px;background:var(--paper);padding:1px 5px;border-radius:4px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1.2fr 1fr} .g4{grid-template-columns:repeat(4,1fr)}
section.block{padding:20px;margin-bottom:18px}
.block-head{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-bottom:12px}
.block-head p{margin:0;font-size:14px;color:var(--ink-2)}
.empty{padding:24px 0;color:var(--ink-3);font-size:15px;text-align:center}
.empty svg.i{width:40px;height:40px;display:block;margin:0 auto 8px;opacity:.5}

/* ---------- forms ---------- */
.field{display:flex;gap:10px}
.field input,textarea{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
textarea{width:100%;min-height:200px;font:12.5px/1.5 var(--mono);resize:vertical}
.btn{border:0;border-radius:8px;padding:12px 18px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--sheet);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn.small{padding:7px 12px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.opts label{font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.opts input{padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
.hint{font-size:14px;color:var(--ink-3);margin-top:10px}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:1em}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}

/* ---------- visual pieces ---------- */
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.steps4 div{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;text-align:center;font:600 14px var(--display)}
.steps4 svg.i{width:28px;height:28px;color:var(--imp)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{padding:14px 16px}
.kpi .v{font:700 28px/1.1 var(--display)}
.kpi .l{font-size:13px;color:var(--ink-2)}
.ring text{font-family:var(--display);font-weight:700;fill:var(--ink)}
.cmp .row{display:grid;grid-template-columns:70px 1fr 48px;gap:10px;align-items:center;margin:10px 0;font-size:14px}
.cmp .track{position:relative;height:16px;background:var(--paper);border-radius:4px}
.cmp .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.cmp .ci{position:absolute;top:-3px;bottom:-3px;border-left:2px solid var(--ink);border-right:2px solid var(--ink);opacity:.55}
.cmp .ci::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid var(--ink)}
.cmp .v{font:600 15px var(--mono);text-align:right}
.chart{width:100%;height:auto;display:block}
.chart .axis{stroke:var(--rule)}
.chart text{font:11px var(--body);fill:var(--ink-3)}

/* ---------- lists ---------- */
.list{list-style:none;margin:0;padding:0}
.list li a{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--rule);text-decoration:none;color:var(--ink)}
.list li:first-child a{border-top:0}
.list .src{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;min-width:0}
.list .sub{font-size:12px;color:var(--ink-3)}
.list .kind{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--paper);color:var(--ink-2)}
.scorepair{font:600 14px var(--mono);white-space:nowrap}
.scorepair .up{color:var(--ok)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

/* ---------- run page ---------- */
.runhead{padding:8px 0 4px;display:flex;gap:12px 18px;align-items:flex-end;flex-wrap:wrap}
.runhead .src{font:700 24px/1.1 var(--display);word-break:break-all}
.runhead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.subtabs{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 16px;padding:4px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;position:sticky;top:0;z-index:5;scrollbar-width:none}
.subtabs button{flex:none;border:0;background:transparent;padding:9px 14px;border-radius:7px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap}
.subtabs button[aria-selected="true"]{background:var(--ink);color:var(--sheet)}
.subtabs button[aria-selected="true"] .faint{color:inherit;opacity:.7}
@media (max-width:760px){.subtabs{top:57px}}
.status{font-size:14px;padding:3px 10px;border-radius:999px;background:var(--imp-soft);color:var(--imp)}
.status.done{background:var(--ok-soft);color:var(--ok)} .status.error{background:var(--bad-soft);color:var(--bad)}
.status.cancelled{background:var(--paper);color:var(--ink-2)}
.progress{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:14px}
.progress span{display:block;height:100%;background:var(--imp);transition:width .4s}
.progress-l{font-size:13px;color:var(--ink-2);margin-top:6px}
ol.stages{list-style:none;display:grid;grid-template-columns:repeat(9,1fr);gap:4px;padding:0;margin:14px 0 18px;counter-reset:s}
ol.stages li{font-size:12px;line-height:1.25;color:var(--ink-3);padding-top:10px;border-top:3px solid var(--rule);counter-increment:s}
ol.stages li::before{content:counter(s) " ";font-weight:600}
ol.stages li.done{border-color:var(--ink);color:var(--ink-2)}
ol.stages li.now{border-color:var(--imp);color:var(--ink);font-weight:600}
.hero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;padding:20px;margin-bottom:18px}
.hero .verdict-t{font-size:16px;line-height:1.45;margin:0 0 6px}
.metrics3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.metric{padding:14px 16px}
.metric .v{font:700 22px var(--display)}
.metric .l{font-size:13px;color:var(--ink-2)}
.metric .d{font-size:13px;font-family:var(--mono)}
.d.good{color:var(--ok)} .d.badd{color:var(--bad)}
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.lanegroup h3{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.swatch{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.lane{display:grid;grid-template-columns:62px 1fr 64px;gap:10px;align-items:center;padding:5px 0;border:0;background:none;width:100%;text-align:left;cursor:pointer;border-radius:6px;min-height:32px}
.lane:hover{background:var(--paper)}
.lane:disabled{cursor:default}
.lane .id{font:500 12px var(--mono);color:var(--ink-2)}
.ticks{display:flex;gap:2px;height:18px;align-items:stretch;overflow:hidden}
.tick{flex:0 0 calc((100% - 46px)/24);min-width:3px;border-radius:2px;background:var(--rule)}
.tick.read_file,.tick.list_dir{background:var(--a-read)} .tick.search{background:var(--a-search)}
.tick.run{background:var(--a-run)} .tick.replace,.tick.write_file{background:var(--a-edit)}
.tick.fail{background:var(--a-err)} .tick.finish{background:var(--ink)}
.tick.live{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.tick.live{animation:none}}
.verdict{font-size:12px;font-weight:600;text-align:right}
.verdict.solved{color:var(--ok)} .verdict.failed{color:var(--bad)} .verdict.running{color:var(--imp)}
.legend{display:flex;gap:8px 14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.finding{padding:12px 0;border-top:1px solid var(--rule)}
.finding:first-of-type{border-top:0}
.sev{font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;margin-right:8px;vertical-align:2px}
.sev.high{background:var(--bad-soft);color:var(--bad)} .sev.medium{background:var(--warn-soft);color:var(--warn)} .sev.low{background:var(--paper);color:var(--ink-2)}
.finding p{margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.finding .fix{color:var(--ink)}
.bars .row{display:grid;grid-template-columns:minmax(0,150px) 1fr 26px;gap:10px;align-items:center;font-size:14px;margin:8px 0}
.bars .track{height:10px;background:var(--paper);border-radius:3px;overflow:hidden}
.bars .fill{height:100%;background:var(--ink-2);display:block}
.md{font-size:14px;line-height:1.55;max-height:520px;overflow:auto;padding:4px 18px 4px 4px}
.md p,.md li{overflow-wrap:anywhere}
.md h1,.md h2,.md h3{font-family:var(--display);margin:16px 0 6px} .md h1{font-size:22px} .md h2{font-size:18px} .md h3{font-size:15px}
.md pre{background:var(--paper);padding:10px 12px;border-radius:6px;overflow:auto}
.md pre code{background:none;padding:0}
.mdtabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tab{border:1px solid var(--rule);background:transparent;border-radius:6px;padding:5px 10px;font-size:13px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--ink-2);font-size:13px;padding:8px 10px 8px 0;border-bottom:1px solid var(--rule)}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--rule);vertical-align:top}
td.num{font-family:var(--mono);font-size:13px;white-space:nowrap}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:3px;background:var(--bad)}
.dot.y{background:var(--ok)}
.models .row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:10px 0;border-top:1px solid var(--rule);align-items:baseline}
.models .role{font:700 16px var(--display)}
.models .mono{word-break:break-all}
.log{max-height:260px;overflow:auto;font:12.5px/1.6 var(--mono);color:var(--ink-2)}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
.glossary dt{font-weight:600;margin-top:12px}
.glossary dd{margin:2px 0 0;color:var(--ink-2);font-size:14px}

/* ---------- verifier ---------- */
.checks{list-style:none;margin:0;padding:0}
.checks li{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--rule)}
.checks li:first-child{border-top:0}
.badge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700}
.badge svg.i{width:18px;height:18px;stroke-width:2.4}
.badge.pass{background:var(--ok-soft);color:var(--ok)} .badge.fail{background:var(--bad-soft);color:var(--bad)}
.badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.skip,.badge.wait{background:var(--paper);color:var(--ink-3)}
.checks .t{font-weight:600}
.checks .x{font-size:13px;color:var(--ink-2)}
.checks pre{margin:6px 0 0;font:12px/1.5 var(--mono);background:var(--paper);padding:8px 10px;border-radius:6px;white-space:pre-wrap;word-break:break-word;max-height:200px;overflow:auto}

dialog{border:1px solid var(--rule);border-radius:12px;padding:0;max-width:880px;width:calc(100% - 32px);background:var(--sheet);color:var(--ink)}
dialog::backdrop{background:rgba(24,33,58,.45)}
.dlg-head{display:flex;gap:8px 12px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--sheet);flex-wrap:wrap}

/* ---------- app feel on phones and PCs ---------- */
html{-webkit-tap-highlight-color:transparent}

.offline-bar{display:none;position:sticky;left:0;right:0;top:0;z-index:40;padding:6px 12px;padding-top:max(6px,env(safe-area-inset-top));
  text-align:center;font-size:13px;font-weight:600;background:var(--warn);color:var(--sheet)}

.iconbtn{border:0;background:transparent;color:inherit;width:44px;height:44px;display:grid;place-items:center;border-radius:10px;cursor:pointer}

  .tab,.btn.small,.seg button,.subtabs button,button.chip{min-height:44px}

}


/* ---------- welcome: the story of the product, first thing a new visitor sees ---------- */
.wl{--wl-bg:#0E1424;background:var(--wl-bg);color:#E6EAF3;min-height:100vh;overflow-x:hidden}

  padding-top:max(14px,env(safe-area-inset-top));background:rgba(14,20,36,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06)}
.wl-nav .mark{color:#fff;padding:0}
.wl-nav .sp{flex:1}
.wl-ghost{display:inline-flex;align-items:center;text-decoration:none;background:transparent;border:1px solid rgba(255,255,255,.18);color:#E6EAF3;border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:14px}
.wl-cta{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:15px 26px;font:700 16px var(--body);cursor:pointer;
  color:#0E1424;background:linear-gradient(135deg,#FFFFFF,#C9D6FF);box-shadow:0 10px 40px -10px rgba(111,143,255,.8);text-decoration:none}
.wl-cta:hover{filter:brightness(1.05)} .wl-cta svg.i{width:18px;height:18px}
.wl-sec{max-width:1120px;margin:0 auto;padding:72px 20px}
.wl-hero{position:relative;padding-top:56px;text-align:center}
.wl-hero::before{content:"";position:absolute;inset:-120px -40vw auto;height:720px;z-index:0;pointer-events:none;
  background:radial-gradient(40% 50% at 30% 30%,rgba(61,99,240,.45),transparent 70%),radial-gradient(35% 45% at 72% 40%,rgba(30,138,90,.35),transparent 70%),radial-gradient(30% 40% at 50% 80%,rgba(180,35,60,.25),transparent 70%);
  filter:blur(10px);animation:wlglow 14s ease-in-out infinite alternate;
  -webkit-mask-image:linear-gradient(#000 45%,transparent);mask-image:linear-gradient(#000 45%,transparent)}
@keyframes wlglow{to{transform:translate3d(0,40px,0) scale(1.08)}}
.wl-hero > *{position:relative;z-index:1}
.wl-kicker{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;letter-spacing:.02em;color:#C9D6FF;
  border:1px solid rgba(201,214,255,.25);background:rgba(255,255,255,.04);padding:6px 12px;border-radius:999px}
.wl h1{color:#fff;font-size:clamp(38px,6.4vw,76px);line-height:1.02;letter-spacing:-.035em;margin:22px auto 18px;max-width:14ch}
.wl h1 em{font-style:normal;background:linear-gradient(90deg,#8AA2FF,#5BE0A6);-webkit-background-clip:text;background-clip:text;color:transparent}
.wl-lead{font-size:clamp(17px,2vw,21px);color:#B3BCD0;max-width:60ch;margin:0 auto 30px;line-height:1.5}
.wl-ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;align-items:center}
.wl-proof{margin:42px auto 0;max-width:880px;border-radius:20px;padding:22px;background:rgba(27,35,53,.75);border:1px solid rgba(255,255,255,.08);
  box-shadow:0 40px 80px -40px rgba(0,0,0,.8);text-align:left}
.wl-proof .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;font-size:13px;color:#8590A8}
.wl-proof .big{font:700 15px var(--display);color:#fff}
.wl-proof .score{margin-left:auto;font:700 28px var(--display);color:#fff;display:flex;align-items:center;gap:10px}
.wl-proof .score .a{color:#5BE0A6}
.wl-lanes{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.wl-lanes h4{margin:0 0 8px;font:600 13px var(--body);color:#B3BCD0;display:flex;gap:8px;align-items:center}
.wl-lane{display:grid;grid-template-columns:1fr 64px;gap:10px;align-items:center;min-height:22px;margin:4px 0}
.wl-lane .ticks{height:14px}
.wl-lane .tick{opacity:0;animation:wltick .25s ease-out forwards}
@keyframes wltick{from{opacity:0;transform:scaleY(.2)}to{opacity:1;transform:none}}
.wl-lane .v{font-size:12px;font-weight:700;text-align:right;opacity:0;animation:wltick .3s ease-out forwards}
.wl-lane .v.ok{color:#5BE0A6} .wl-lane .v.no{color:#FF8597}
.wl-h2{font:700 clamp(28px,3.6vw,44px)/1.08 var(--display);letter-spacing:-.03em;color:#fff;margin:0 0 12px;max-width:20ch}
.wl-sub{color:#B3BCD0;max-width:62ch;margin:0 0 34px;font-size:17px}
.wl-eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8AA2FF;margin-bottom:12px}
.wl-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.wl-card{padding:22px;border-radius:18px;background:rgba(27,35,53,.6);border:1px solid rgba(255,255,255,.07)}
.wl-card svg.i{width:26px;height:26px;color:#8AA2FF;margin-bottom:12px}
.wl-card h3{color:#fff;font-size:18px;margin-bottom:6px}
.wl-card p{margin:0;color:#B3BCD0;font-size:15px;line-height:1.5}
.wl-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;counter-reset:st}
.wl-step{position:relative;padding:22px 20px;border-radius:18px;background:linear-gradient(180deg,rgba(61,99,240,.14),rgba(27,35,53,.5));border:1px solid rgba(138,162,255,.18)}
.wl-step::before{counter-increment:st;content:counter(st);position:absolute;top:16px;right:18px;font:700 40px var(--display);color:rgba(255,255,255,.07)}
.wl-step .who{display:inline-block;font-size:12px;font-weight:700;color:#0E1424;background:#8AA2FF;border-radius:999px;padding:3px 9px;margin-bottom:12px}
.wl-step .who.g{background:#5BE0A6} .wl-step .who.r{background:#FF8597} .wl-step .who.y{background:#E0A84A}
.wl-step h3{color:#fff;font-size:17px;margin-bottom:6px}
.wl-step p{margin:0;color:#B3BCD0;font-size:14px;line-height:1.5}
.wl-split{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.wl-code{font:13px/1.65 var(--mono);background:#0A0F1C;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px 0;overflow:hidden}

.wl-code .bad{background:rgba(255,133,151,.12);color:#FF8597} .wl-code .ok{color:#8590A8}
.wl-code .tag{float:right;font:700 11px var(--body);padding:1px 8px;border-radius:999px;background:#FF8597;color:#0E1424;margin-left:10px}
.wl-list{list-style:none;padding:0;margin:0 0 26px;display:grid;gap:12px}
.wl-list li{display:flex;gap:12px;align-items:flex-start;color:#D5DBEA}
.wl-list svg.i{color:#5BE0A6;flex:none;margin-top:1px}
.wl-stack{display:flex;flex-wrap:wrap;gap:12px}
.wl-chip{padding:12px 16px;border-radius:14px;background:rgba(27,35,53,.6);border:1px solid rgba(255,255,255,.08);min-width:200px;flex:1}
.wl-chip b{display:block;color:#fff;font-size:15px} .wl-chip span{color:#8590A8;font-size:13px}
.wl-end{text-align:center;padding-bottom:110px}
.wl-foot{text-align:center;color:#5E6A80;font-size:13px;padding:0 20px 40px}
.wl [data-reveal]{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.wl [data-reveal].in{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){.wl [data-reveal]{opacity:1;transform:none;transition:none} .wl-hero::before{animation:none} .wl-lane .tick,.wl-lane .v{animation:none;opacity:1}}
@media (max-width:860px){

}
@media (max-width:560px){
  .wl-sec{padding:52px 16px} .wl-hero{padding-top:36px}
  .wl-cards,.wl-steps,.wl-lanes{grid-template-columns:1fr}
  .wl-proof{padding:16px} .wl-proof .score{margin-left:0;width:100%}
  .wl-nav .wl-ghost.hide-s{display:none}
  .wl-code{font-size:11.5px}
}

/* ---------- motion + loading ---------- */
#app > *{animation:rise .28s ease-out both}
#app > *:nth-child(2){animation-delay:.04s} #app > *:nth-child(3){animation-delay:.08s} #app > *:nth-child(4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sheet{transition:box-shadow .2s,transform .2s}
.kpi:hover,.metric:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(24,33,58,.04),0 16px 32px -18px rgba(24,33,58,.35)}
.list li a{transition:background .15s}
.list li a:hover{background:var(--paper)}
.btn{transition:transform .1s,filter .15s}
.btn:not(:disabled):hover{filter:brightness(1.12)}
.btn:not(:disabled):active{transform:scale(.97)}
.skel{border-radius:14px;background:linear-gradient(90deg,var(--sheet) 25%,var(--paper) 50%,var(--sheet) 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite;border:1px solid var(--rule)}
@keyframes shimmer{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){#app > *,.skel{animation:none} .sheet,.btn{transition:none}}
.elapsed{font:500 13px var(--mono);color:var(--ink-2)}
.searchbox{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet) no-repeat 13px 50%/18px;margin-bottom:12px}
kbd{font:600 11px var(--mono);padding:2px 6px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;background:var(--paper);color:var(--ink-2)}
.navlink.kbd{margin-top:6px;font-size:13px;color:#8C96AA;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.navlink.kbd kbd{margin-left:auto;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);color:#C9D1E4}

/* ---------- diff viewer ---------- */
.diff{font:12px/1.55 var(--mono);background:var(--paper);border-radius:8px;overflow:auto;max-height:560px;padding:8px 0}
.diff div{padding:0 12px;white-space:pre;min-height:1.55em}
.diff .add{background:var(--ok-soft);color:var(--ok)} .diff .rm{background:var(--bad-soft);color:var(--bad)}
.diff .hunk{color:var(--imp);background:var(--imp-soft)} .diff .file{font-weight:600;color:var(--ink);padding-top:6px}

/* ---------- command palette (Ctrl+K) ---------- */
#pal{max-width:560px;margin-top:12vh}
#pal input{width:100%;border:0;border-bottom:1px solid var(--rule);padding:16px 18px;font-size:17px;background:transparent;outline:none}
#pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
#pal li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px}
#pal li .sub{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap}
#pal li[aria-selected="true"]{background:var(--imp-soft);color:var(--imp)}
#pal li span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* ---------- print: the run / verification page becomes a clean report ---------- */
@media print{
  body{background:#fff}
  nav.side,nav.tabs,.mobilehead,.actions,.subtabs,.toast,.progress,#pal{display:none!important}
  .shell{display:block} main.content{padding:0}
  .sheet{box-shadow:none;break-inside:avoid}
  #app > *{animation:none}
  details > *{display:block}
  .md,.log,.diff{max-height:none;overflow:visible}
}

@media (max-width:1000px){
  .g2,.lanes{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .opts{grid-template-columns:1fr 1fr}

}

  .mobilehead .mark{padding:0;font-size:19px}

  input,textarea,select{font-size:16px!important}

  .runhead .actions{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}

  nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--nav-h);font-size:11px;font-weight:600;color:var(--ink-3);text-decoration:none}
  nav.tabs a[aria-current="page"]{color:var(--imp)}
  nav.tabs a svg.i{padding:3px 14px;width:52px;height:30px;border-radius:999px;transition:background .15s}
  nav.tabs a[aria-current="page"] svg.i{background:var(--imp-soft)}
  .authwrap{grid-template-columns:1fr}
  .authbrand{padding:28px 20px 36px;padding-top:max(28px,env(safe-area-inset-top))}
  .authbrand ul{display:none}
  .authbrand .foot{display:none}
  .authform{padding:0 16px 32px;margin-top:-22px}
  .pagehero{padding:20px 18px;border-radius:16px;margin-top:12px}
  .pagehero .steps4{margin-top:14px}
  .topbar{padding-top:14px}
  .topbar .chips{display:none}
  .field{flex-direction:column}
  .field .btn{width:100%;padding:14px}
  .steps4{grid-template-columns:repeat(4,1fr);gap:4px}
  .steps4 div{font-size:12px;padding:10px 2px}
  .kpi .v{font-size:23px}
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}
  .metrics3{grid-template-columns:1fr}
  .runhead .src{font-size:20px}
  .runhead .actions{margin-left:0;width:100%}
  ol.stages li{font-size:11px}
  .lane{grid-template-columns:48px 1fr 56px;gap:6px}
  section.block{padding:16px}
  .bars .row{grid-template-columns:minmax(0,1fr) 90px 22px}
  .models .row{grid-template-columns:1fr auto}
  .models .row > span:nth-child(2){grid-column:1 / -1;order:3}
  dialog{width:100%;max-width:none;height:100%;max-height:none;margin:0;border-radius:0;border:0}
  .dlg-body{max-height:none}
}
</style>

function toast(msg, href){
  document.querySelectorAll(".toast").forEach(x => x.remove());
  const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
  if (href){ const a = document.createElement("a"); a.href = href; a.textContent = L().open;
    a.onclick = e => { e.preventDefault(); el.remove(); go(href); }; el.appendChild(a); }
  document.body.appendChild(el); setTimeout(() => el.remove(), href ? 6000 : 2600);
}

function md(src){
  // tiny, safe markdown: escape first, then format
  const lines = esc(src).split("\n"); let out = [], inCode = false, inList = false;
  for (const raw of lines){
    if (raw.trim().startsWith("```")){ if(inList){out.push("</ul>");inList=false}
      out.push(inCode ? "</code></pre>" : "<pre><code>"); inCode = !inCode; continue; }
    if (inCode){ out.push(raw); continue; }
    let l = raw.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    const h = l.match(/^(#{1,3})\s+(.*)/);
    const li = l.match(/^\s*[-*]\s+(.*)/);
    if (li){ if(!inList){out.push("<ul>");inList=true} out.push("<li>"+li[1]+"</li>"); continue; }
    if (inList){ out.push("</ul>"); inList=false; }
    if (h) out.push(`<h${h[1].length}>${h[2]}</h${h[1].length}>`);
    else if (l.trim()) out.push("<p>"+l+"</p>");
  }
  if (inList) out.push("</ul>"); if (inCode) out.push("</code></pre>");
  return out.join("\n");
}

async function api(path, opts){
  const r = await fetch(path, opts); const j = await r.json().catch(() => ({}));
  // session ended (e.g. signed out from another device): show sign-in and leave the caller pending, so no page draws over it
  if (r.status === 401 && j.auth){ if (ME !== false){ ME = false; authScreen(); } return new Promise(() => {}); }
  if (!r.ok) throw new Error(j.error || r.statusText); return j;
}
const post = (path, body, hdr = {}) => api(path, {method: "POST", headers: {"Content-Type": "application/json", ...hdr}, body: JSON.stringify(body || {})});

    const fresh = FEED_SINCE ? (r.items || []) : [];
    FEED_SINCE = r.now || FEED_SINCE;
    for (const a of fresh){

}

function ring(score, size = 120, label = ""){
  const r = size / 2 - 9, c = 2 * Math.PI * r, v = score == null ? 0 : Math.max(0, Math.min(100, score));
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label)} ${score ?? "–"}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--rule)" stroke-width="9"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${scoreColor(score)}" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${c * v / 100} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="${size * .3}">${score ?? "–"}</text></svg>`;
}

function cmpBars(b, a){
  const t = L(), row = (lab, m, col) => m && m.n ? `<div class="row"><span>${lab}</span><span class="track">
      <span class="fill" style="width:${m.success_rate*100}%;background:${col}"></span>
      ${m.ci95 ? `<span class="ci" style="left:${m.ci95[0]*100}%;width:${(m.ci95[1]-m.ci95[0])*100}%"></span>` : ""}</span>
      <span class="v">${pct(m.success_rate)}</span></div>` : "";
  return row(t.before, b, "var(--base)") + row(t.after, a, "var(--imp)");
}

function lineChart(points){
  // points: [{label, before, after}] in time order
  const W = 640, H = 220, P = 30, n = points.length;
  const x = i => n === 1 ? W / 2 : P + i * (W - 2 * P) / (n - 1), y = v => H - P - v * (H - 2 * P) / 100;
  const line = (k, col) => `<polyline fill="none" stroke="${col}" stroke-width="2.5" points="${points.map((p, i) => `${x(i)},${y(p[k])}`).join(" ")}"/>` +
    points.map((p, i) => `<circle cx="${x(i)}" cy="${y(p[k])}" r="4" fill="${col}"><title>${esc(p.label)}: ${p[k]}</title></circle>`).join("");
  const grid = [0, 50, 100].map(v => `<line class="axis" x1="${P}" x2="${W - P}" y1="${y(v)}" y2="${y(v)}"/><text x="4" y="${y(v) + 4}">${v}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(L().trendH)}">${grid}${line("before", "var(--base)")}${line("after", "var(--imp)")}</svg>
    <div class="legend"><span><i class="swatch" style="background:var(--base)"></i>${L().before}</span><span><i class="swatch" style="background:var(--imp)"></i>${L().after}</span></div>`;
}

function barRows(entries, colorFor){
  const max = Math.max(1, ...entries.map(e => e[1]));
  return `<div class="bars">${entries.map(([label, v, key]) => `<div class="row"><span>${esc(label)}</span><span class="track"><span class="fill" style="width:${v/max*100}%;${colorFor ? "background:" + colorFor(key) : ""}"></span></span><span class="mono">${v}</span></div>`).join("")}</div>`;
}

function section(){
  const p = location.pathname;
  if (p.startsWith("/run/") || p === "/") return "tester";
  return (NAV.find(([path]) => path !== "/" && p.startsWith(path)) || [, "tester"])[1];
}
function statusChips(){
  const h = HEALTH, t = L();
  if (!h) return `<span class="chip bad">${t.offline}</span>`;
  return `<span class="chip ${h.api_key_set ? "ok" : "bad"}">${h.api_key_set ? t.keyOk : t.keyMissing}</span>` +
         `<span class="chip ${h.tavily_set ? "ok" : "warn"}">${h.tavily_set ? t.tavilyOn : t.tavilyOff}</span>`;
}
function renderShell(){
  const t = L(), cur = section();
  const links = cls => NAV.map(([path, key]) => `<a class="${cls}" href="${path}" data-nav ${cur === key ? 'aria-current="page"' : ""}>${ic(key)}<span>${t.nav[key]}</span></a>`).join("");
  $("#side").innerHTML = `<a class="mark" href="/" data-nav>${LOGO} AgentReady</a>${links("navlink")}
    <a class="navlink kbd" href="/welcome">${ic("robot")}<span>${t.aboutApp}</span></a>
    <button class="navlink kbd" id="palbtn">${ic("search")}<span>${t.palHint}</span><kbd>Ctrl K</kbd></button>
    <div class="navfoot"><div class="chips">${statusChips()}</div>
      ${ME ? `<a class="who" href="/settings" data-nav style="text-decoration:none"><span class="avatar">${esc(ME.user[0].toUpperCase())}</span><span>${esc(ME.user)}<small><span class="live"></span>${esc(ME.device || "")}</small></span></a>` : ""}</div>`;
  $("#palbtn").onclick = openPalette;
  $("#tabs").innerHTML = links("");
  $(".mobilehead .mark").innerHTML = `${LOGO} AgentReady`;
  $("#msearch").innerHTML = ic("search"); $("#msearch").onclick = openPalette; $("#msearch").hidden = !ME && !!AUTH?.accounts;
  document.title = (cur === "tester" && location.pathname === "/" ? "" : t.nav[cur] + " · ") + "AgentReady";
  $("#mchips").innerHTML = HEALTH && !HEALTH.api_key_set ? `<span class="chip bad">${t.keyMissing}</span>` : "";
  document.querySelectorAll("[data-nav]").forEach(a => a.onclick = e => { e.preventDefault(); go(a.getAttribute("href")); });
}
const topbar = title => `<div class="topbar"><h1>${title}</h1><div class="chips">${statusChips()}</div></div>`;

/* ------------------------------------------------------------- tester (home) */
async function tester(){
  const t = L();
  const [runs, vers] = await Promise.all([api("/api/runs").catch(() => []), api("/api/verify").catch(() => [])]);
  const ex = (HEALTH?.examples || [])[0];
  const keyBox = HEALTH && !HEALTH.api_key_set ? `<div class="sheet notice" role="note"><b>${t.keyTitle}</b>
      <ol>${t.keySteps.map(s => `<li>${s}</li>`).join("")}</ol></div>` : "";
  $("#app").innerHTML = `
  <div class="pagehero">${ic("tester", "", "heroico")}
    <h1>${t.testerH}</h1><p>${t.brandP}</p>
    <div class="steps4">${["bug","robot","search","stats"].map((i, k) => `<div>${ic(i)}${t.steps4[k]}</div>`).join("")}</div>
  </div>
  ${keyBox}
  <div class="grid g2">
    <form class="sheet" id="f" style="padding:20px">
      <div class="field">
        <input id="src" name="source" placeholder="${t.srcPh}${HEALTH?.public ? "" : esc(t.srcPhLocal)}" aria-label="${t.srcLabel}" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url">
        <button class="btn" id="go" type="submit">${ic("tester")}${t.go}</button>
      </div>
      <div class="opts">
        <label>${t.tasks}<input name="tasks" type="number" inputmode="numeric" min="1" max="30" value="5"></label>
        <label>${t.repeats}<input name="repeats" type="number" inputmode="numeric" min="1" max="5" value="2"></label>
        <label>${t.parallel}<input name="parallel" type="number" inputmode="numeric" min="1" max="16" value="4"></label>
        <label>${t.steps}<input name="max_steps" type="number" inputmode="numeric" min="6" max="60" value="24"></label>
      </div>
      <div class="hint"><span id="estimate"></span>${ex ? " · " + t.exHint(esc(ex)) : ""}</div>
      <div class="err" id="err" role="alert"></div>
    </form>
    <div>
      <div id="specimen"></div>
      <section class="sheet block"><div class="block-head"><h2>${t.recent}</h2><a href="/history" data-nav style="margin-left:auto;font-size:14px">${t.seeAll}</a></div>
        ${historyList(merge(runs, vers).slice(0, 5)) || empty("history", t.noRuns)}</section>
    </div>
  </div>`;
  renderShell();
  $("#f").onsubmit = start;
  $("#f").oninput = estimate; estimate();
  const exl = $("#ex"); if (exl) exl.onclick = e => { e.preventDefault(); $("#src").value = "example:" + ex; };
  // Share > AgentReady on a phone (share_target) or the "Test a repo" icon shortcut
  const q = new URLSearchParams(location.search);
  const shared = [q.get("url"), q.get("text"), q.get("title")].join(" ").match(/https:\/\/github\.com\/[\w.-]+\/[\w.-]+/);
  if (shared){ $("#src").value = shared[0].replace(/\.git$/, ""); toast(t.shared); }
  if (shared || q.get("focus")){ history.replaceState({}, "", "/"); $("#src").focus(); }
  const lastDone = runs.find(r => r.status === "done");
  if (lastDone) realSpecimen(lastDone.id);
}

function estimate(){
  const f = $("#f"); if (!f) return;
  const v = k => Math.max(1, parseInt(f.elements[k].value) || 1);
  const n = v("tasks") * v("repeats") * 2;  // baseline + improved
  // ~1.5 min per wave of parallel attempts, plus ~2 min for probing, triage and synthesis
  const mins = Math.max(3, Math.round(Math.ceil(n / v("parallel")) * 1.5 + 2));
  $("#estimate").textContent = L().estimate(n, mins);
}

async function realSpecimen(id){
  // before/after of one real task from the latest finished run; nothing is shown until there is real data
  const run = await api("/api/runs/" + id).catch(() => null);
  const box = $("#specimen"); if (!run || !box) return;
  const eps = Object.values(run.episodes || {});
  const pick = run.tasks.map(tk => tk.id).map(tid => ({tid,
      b: eps.find(e => e.task_id === tid && e.condition === "baseline" && !e.success) || eps.find(e => e.task_id === tid && e.condition === "baseline"),
      a: eps.find(e => e.task_id === tid && e.condition === "improved" && e.success) || eps.find(e => e.task_id === tid && e.condition === "improved")}))
    .filter(p => p.b && p.a)
    .sort((x, y) => (y.a.success - y.b.success) - (x.a.success - x.b.success) || (y.b.n_steps - y.a.n_steps) - (x.b.n_steps - x.a.n_steps))[0];
  if (!pick) return;
  const t = L();
  const row = (label, ep) => `<button class="lane" data-go="${esc(id)}"><span class="id">${label}</span><span class="ticks" aria-hidden="true">${ticksOf(ep.steps)}</span><span class="verdict ${ep.success ? "solved" : "failed"}">${ep.success ? t.lane.solved : t.lane.failed}</span></button>`;
  box.innerHTML = `<figure class="sheet" style="margin:0 0 18px;padding:16px 18px"><figcaption class="faint" style="font-size:13px;margin-bottom:8px">${t.specimenCap(esc(id), esc(pick.tid))}</figcaption>${row(t.before, pick.b)}${row(t.after, pick.a)}</figure>`;
  box.querySelectorAll("[data-go]").forEach(el => el.onclick = () => go("/run/" + el.dataset.go));
}

function ticksOf(steps){
  return (steps || []).map(s => `<span class="tick ${esc(s.action)} ${s.ok ? "" : "fail"}" title="${s.n}. ${esc(s.action)}"></span>`).join("");
}

async function start(e){
  e.preventDefault();
  const fd = new FormData(e.target), body = Object.fromEntries(fd.entries());
  const hdr = tokenHeader(); if (hdr === null) return;
  $("#go").disabled = true; $("#err").textContent = "";
  try {
    const r = await api("/api/runs", {method:"POST", headers:{"Content-Type":"application/json", ...hdr}, body: JSON.stringify(body)});
    go("/run/" + r.id);
  } catch(err){ forgetToken(err); $("#err").textContent = err.message; $("#go").disabled = false; }
}

/* ------------------------------------------------------------- run */
async function runPage(id){
  const tick = async () => {
    const was = RUN && RUN.id === id ? RUN.status : null;
    try { RUN = await api("/api/runs/" + id); renderRun(); }
    catch(err){ $("#app").innerHTML = empty("tester", `${esc(err.message)}. <a href="/" data-nav>${L().back}</a>`); renderShell(); clearInterval(POLL); return; }
    const over = !["queued", "running"].includes(RUN.status);
    if (over){ clearInterval(POLL); if (was && was !== RUN.status) notifyFinished(); }
  };
  RUN = null; RUNTAB = "overview";
  await tick();
  if (RUN && ["queued", "running"].includes(RUN.status)) POLL = setInterval(tick, 1500);
}

async function askNotify(id){
  const t = L();
  if (!("Notification" in window)) return toast(t.notifyDenied);
  const p = await Notification.requestPermission();
  if (p !== "granted") return toast(t.notifyDenied);
  NOTIFY_FOR = id; toast(t.notifyOn); route(true);
}

async function notify(body, url){
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const opts = {body, icon: "/icon-192.png", badge: "/icon-192.png", data: {url}};
  // phones only allow notifications through the service worker
  const reg = await navigator.serviceWorker?.getRegistration().catch(() => null);
  if (reg) reg.showNotification("AgentReady", opts); else new Notification("AgentReady", opts);
}

function notifyFinished(){
  if (NOTIFY_FOR !== RUN.id) return;
  NOTIFY_FOR = null;
  const t = L(), m = RUN.metrics || {}, src = RUN.options.label || RUN.options.source;
  notify(RUN.status === "done" ? t.notifyDone(src, m.score_before, m.score_after) : t.notifyErr(src), "/run/" + RUN.id);
}

async function share(url, text){
  const t = L(); url = location.origin + url;
  if (navigator.share){ try { await navigator.share({title: "AgentReady", text, url}); } catch {} return; }
  try { await navigator.clipboard.writeText(url); toast(t.copied); } catch { prompt("", url); }
}

async function del(path){
  const t = L();
  if (!confirm(t.delConfirm)) return;
  const hdr = tokenHeader(); if (hdr === null) return;
  try { await api(path, {method: "DELETE", headers: hdr}); toast(t.deleted); go("/history"); }
  catch(err){ forgetToken(err); toast(err.message); }
}

function delta(a, b, lowerIsBetter, fmt){
  if (a == null || b == null) return "";
  const d = b - a; if (Math.abs(d) < 1e-9) return `<span class="d faint">${L().noChange}</span>`;
  const good = lowerIsBetter ? d < 0 : d > 0;
  return `<span class="d ${good ? "good" : "badd"}">${d > 0 ? "+" : "−"}${fmt(Math.abs(d))}</span>`;
}

function lanesFor(cond){
  const t = L(), out = [];
  const keys = Object.keys(RUN.live || {}).filter(k => k.startsWith(cond + ":"));
  keys.sort((a,b) => a.localeCompare(b, undefined, {numeric:true}));
  for (const k of keys){
    const live = RUN.live[k], ep = RUN.episodes[k];
    let ticks = ep ? ticksOf(ep.steps) : "";
    const active = ["queued", "running"].includes(RUN.status);
    if (!ep){ const n = live.n || 0;
      ticks = Array.from({length:n}, (_, i) => `<span class="tick ${i === n-1 ? esc(live.action) + (active ? " live" : "") : "read_file"}" title="${i+1}"></span>`).join(""); }
    const st = ep ? (ep.success ? "solved" : "failed") : active ? "running" : "stopped";
    out.push(`<button class="lane" data-key="${esc(k)}" ${ep ? "" : "disabled"}><span class="id">${esc(live.task_id)} · ${esc(live.repeat)}</span><span class="ticks">${ticks}</span><span class="verdict ${st === "stopped" ? "faint" : st}">${st === "running" ? esc(live.action) : t.lane[st]}</span></button>`);
  }
  if (!out.length) return `<p class="faint" style="font-size:14px">${cond === "baseline" ? t.waitBase : t.waitImp}</p>`;
  return out.join("");
}

function verdictText(m){
  const t = L(), b = m.baseline || {}, a = m.improved || {};
  if (m.score_after == null || !a.n) return "";
  const diff = a.success_rate - b.success_rate;
  let txt = diff > 0.05 ? t.verdictUp(pct(b.success_rate), pct(a.success_rate)) : diff < -0.05 ? t.verdictDown() : t.verdictSame();
  if (b.ci95 && a.ci95 && Math.abs(diff) > 0.05 && b.ci95[1] >= a.ci95[0] && a.ci95[1] >= b.ci95[0]) txt += " " + t.noisy;
  return txt;
}

function numbersTable(m){
  const t = L(), b = m.baseline || {}, a = m.improved || {};
  if (!b.n) return "";
  const f = {found_code_rate: pct, ran_tests_rate: pct, avg_seconds: x => x == null ? "–" : x.toFixed(0),
             cost_usd: x => x == null ? "–" : "$" + x.toFixed(3), cost_per_solved: x => x == null ? "–" : "$" + x.toFixed(3),
             median_first_touch: x => x == null ? "–" : String(x)};
  const rows = Object.keys(t.nrows).filter(k => k in b || k in a);
  return `<section class="sheet block"><details><summary>${t.numbers}</summary>
    <div class="scrollx"><table><thead><tr>${t.nth.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>
    ${rows.map(k => `<tr><td>${t.nrows[k]}</td><td class="num">${(f[k] || num)(b[k])}</td><td class="num">${(f[k] || num)(a[k])}</td></tr>`).join("")}
    </tbody></table></div></details></section>`;
}

function renderRun(){
  const t = L(), r = RUN, m = r.metrics || {}, b = m.baseline || {}, a = m.improved || {};
  const doneSet = new Set(r.stages_done || []);
  const findings = (r.synthesis && r.synthesis.findings) || [];
  const cats = m.categories || countCats(r.triage || []);
  const running = r.status === "running" || r.status === "queued";
  const stageLabel = s => t.stages[s.key] || s.label;
  const curStage = r.stages.find(s => s.key === r.stage);
  const total = (r.tasks || []).length * (r.options.repeats || 1) * 2;
  const finished = Object.keys(r.episodes || {}).length;
  const scroll = window.scrollY;
  $("#app").innerHTML = `
  <div class="runhead" style="padding-top:18px">
    <div><div class="faint" style="font-size:13px">${t.runN} ${esc(r.id)} · ${when(r.created)} · <span class="elapsed" id="elapsed">${dur((r.finished || Date.now() / 1000) - r.created)}</span> ${t.elapsed}</div><div class="src">${esc(r.options.label || r.options.source)}</div></div>
    <span class="status ${esc(r.status)}">${esc(running && curStage ? stageLabel(curStage) : (t.status[r.status] || r.status))}</span>
    <div class="actions">
      ${running && NOTIFY_FOR !== r.id ? `<button class="btn ghost small" id="notify">${t.notify}</button>` : ""}
      ${running && !HEALTH?.public ? `<button class="btn ghost small danger" id="stop">${ic("stop", 'style="width:16px;height:16px"')}${t.stop}</button>` : ""}
      ${r.agents_md ? `<a class="btn ghost small" href="/api/runs/${esc(r.id)}/agents.md">${ic("upload", 'style="transform:rotate(180deg);width:16px;height:16px"')}${t.download}</a>
        <button class="btn ghost small" id="copymd">${ic("copy", 'style="width:16px;height:16px"')}${t.copyMd}</button>` : ""}
      ${!running ? `<button class="btn ghost small" id="again">${ic("again", 'style="width:16px;height:16px"')}${t.again}</button>
        <button class="btn ghost small" id="print">${ic("print", 'style="width:16px;height:16px"')}${t.print}</button>` : ""}
      <button class="btn ghost small" id="share">${t.share}</button>
      ${!running && !HEALTH?.public ? `<button class="btn ghost small danger" id="del">${t.del}</button>` : ""}
    </div>
  </div>
  ${r.error ? `<div class="sheet notice" style="border-left-color:var(--bad)"><b style="color:var(--bad)">${t.stopped}</b> ${esc(r.error)}</div>` : ""}
  ${running && total ? `<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${finished}"><span style="width:${Math.round(finished/total*100)}%"></span></div>
    <div class="progress-l">${t.progress(finished, total, curStage ? stageLabel(curStage) : "")}</div>` : ""}
  <ol class="stages">${r.stages.map(s => `<li class="${doneSet.has(s.key) ? "done" : ""} ${s.key === r.stage && running ? "now" : ""}">${esc(stageLabel(s))}</li>`).join("")}</ol>

  <div class="subtabs" role="tablist">${Object.entries(t.runTabs).map(([k, l]) =>
    `<button role="tab" data-rt="${k}" aria-selected="${RUNTAB === k}">${l}${k === "attempts" ? ` <span class="faint">${finished}</span>` : k === "causes" && findings.length ? ` <span class="faint">${findings.length}</span>` : ""}</button>`).join("")}</div>

  ${RUNTAB === "overview" ? `
  <div class="sheet hero">
    <div style="display:flex;align-items:center;gap:10px">${ring(m.score_before ?? null, 92, t.before)}<span class="faint" style="font-size:24px">→</span>${ring(m.score_after ?? null, 128, t.score)}</div>
    <div style="width:100%"><div class="faint" style="font-size:13px">${t.score}</div>
      ${verdictText(m) ? `<p class="verdict-t">${verdictText(m)}</p>` : ""}
      <div class="cmp">${cmpBars(b, a)}</div>
      ${b.n ? `<div class="faint" style="font-size:12px">${t.cmpH}</div>` : ""}</div>
  </div>

  <div class="metrics3">
    <div class="sheet metric"><div class="l">${t.solved}</div><div class="v">${pct(b.success_rate)} → ${pct(a.success_rate)}</div>${delta(b.success_rate, a.success_rate, false, x => Math.round(x*100) + t.pts)}</div>
    <div class="sheet metric"><div class="l">${t.stepsM}</div><div class="v">${b.avg_steps != null ? b.avg_steps.toFixed(1) : "–"} → ${a.avg_steps != null ? a.avg_steps.toFixed(1) : "–"}</div>${delta(b.avg_steps, a.avg_steps, true, x => x.toFixed(1))}</div>
    <div class="sheet metric"><div class="l">${t.tokM}</div><div class="v">${num(b.tokens_per_solved)} → ${num(a.tokens_per_solved)}</div>${delta(b.tokens_per_solved, a.tokens_per_solved, true, num)}</div>
  </div>
  ${numbersTable(m)}
  <section class="sheet block"><details><summary>${t.glossaryH}</summary>
    <dl class="glossary">${t.glossary.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></details></section>` : ""}

  ${RUNTAB === "attempts" ? `
  <section class="sheet block">
    <div class="block-head"><h2>${t.attempts}</h2><p>${t.attemptsX}</p></div>
    <div class="legend" style="margin-bottom:14px">${["var(--a-read)","var(--a-search)","var(--a-run)","var(--a-edit)","var(--a-err)","var(--ink)"]
      .map((c, i) => `<span><i class="swatch" style="background:${c}"></i>${t.lg[i]}</span>`).join("")}</div>
    <div class="lanes">
      <div class="lanegroup"><h3><i class="swatch" style="background:var(--base)"></i>${t.withOld}</h3>${lanesFor("baseline")}</div>
      <div class="lanegroup"><h3><i class="swatch" style="background:var(--imp)"></i>${t.withNew}</h3>${lanesFor("improved")}</div>
    </div>
  </section>` : ""}

  ${RUNTAB === "causes" ? `
  <div class="grid g2">
    <section class="sheet block">
      <div class="block-head"><h2>${t.why}</h2></div>
      ${r.synthesis?.summary ? `<p class="muted" style="margin-top:0">${esc(r.synthesis.summary)}</p>` : ""}
      ${findings.length ? findings.map(f => `<div class="finding"><span class="sev ${esc(f.severity)}">${esc(t.sev[f.severity] || f.severity)}</span><b>${esc(f.title)}</b>
        <p>${esc(f.evidence)}</p><p class="fix"><b>${t.fix}</b> ${esc(f.fix)}</p></div>`).join("") : `<p class="faint">${t.noFind}</p>`}
    </section>
    <section class="sheet block">
      <div class="block-head"><h2>${t.way}</h2></div>
      ${Object.keys(cats).length ? barRows(Object.entries(cats).sort((x,y) => y[1]-x[1]).map(([k, v]) => [t.cats[k] || k, v, k]), k => k === "none" ? "var(--ok)" : "var(--ink-2)") : `<p class="faint">${t.noTri}</p>`}
      <h3 style="margin-top:20px">${t.models}</h3>
      <div class="models">${["nano","super","ultra"].map(role => { const u = (r.usage||{})[role] || {}; return `
        <div class="row"><span class="role">${role[0].toUpperCase()+role.slice(1)}</span>
          <span><span class="mono">${esc((r.models||{})[role] || "")}</span><br><span class="faint" style="font-size:13px">${esc(t.roles[role] || "")}</span></span>
          <span class="mono" style="text-align:right">${num(u.calls || 0)} ${t.calls}<br>${num((u.prompt_tokens||0)+(u.completion_tokens||0))} ${t.tok}</span></div>`; }).join("")}</div>
      ${(r.notes||[]).length ? `<p class="faint" style="font-size:12px">${r.notes.map(esc).join("<br>")}</p>` : ""}
    </section>
  </div>` : ""}

  ${RUNTAB === "instructions" ? `
  <section class="sheet block">
    <div class="block-head"><h2>${t.instr}</h2>
      ${r.agents_md ? `<div class="mdtabs"><button class="tab" data-md="after" aria-pressed="${MDVIEW==="after"}">${t.newMd}</button><button class="tab" data-md="before" aria-pressed="${MDVIEW==="before"}">${t.oldMd}</button></div>` : ""}</div>
    ${r.agents_md ? `<div class="md" tabindex="0" role="region" aria-label="AGENTS.md">${MDVIEW === "after" ? md(r.agents_md) : (r.agents_md_before ? md(r.agents_md_before) : `<p class="faint">${t.noOld}</p>`)}</div>` : `<p class="faint">${t.notYet}</p>`}
    ${(r.research||[]).filter(x => x.url).length ? `<details style="margin-top:12px"><summary>${t.sources(r.research.filter(x=>x.url).length)}</summary><ul>${r.research.filter(x=>x.url).map(x => `<li><a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer">${esc(x.title || x.url)}</a></li>`).join("")}</ul></details>` : ""}
  </section>` : ""}

  ${RUNTAB === "tasks" ? `
  <section class="sheet block">
    <div class="block-head"><h2>${t.tasksH}</h2></div>
    ${r.tasks.length ? `<div class="scrollx"><table><thead><tr>${t.th.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>
    ${r.tasks.map(tk => { const row = (m.per_task||{})[tk.id] || perTask(tk.id);
      const dots = arr => (arr||[]).map(x => `<span class="dot ${x ? "y" : ""}" title="${x ? t.lane.solved : t.lane.failed}"></span>`).join("");

function dur(s){ s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60);

function perTask(id){ const row = {baseline:[], improved:[]};

        <form id="erase" class="field"><input type="password" id="erasepw" autocomplete="current-password" required aria-label="${t.erasePw}" placeholder="${t.erasePw}">
          <button class="btn danger" style="background:var(--bad);color:var(--sheet)">${t.eraseBtn}</button></form>
        <div class="err" id="eraseerr" role="alert"></div></section>
    </div>` : ""}
  </div>`;
  renderShell();
  document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { LANG = b.dataset.lang; store.set("ar-lang", LANG); document.documentElement.lang = LANG; route(); });
  document.querySelectorAll("[data-theme-set]").forEach(b => b.onclick = () => { THEME = b.dataset.themeSet; store.set("ar-theme", THEME); applyTheme(); settingsPage(); });
  const inst = $("#inst");
  if (inst) inst.onclick = async () => { if (INSTALL){ INSTALL.prompt(); await INSTALL.userChoice; INSTALL = null; settingsPage(); } else toast(t.iosInstall); };
  if (!ME) return;
  $("#logout").onclick = async () => { await post("/api/auth/logout").catch(() => {}); location.replace("/login"); };
  $("#pairgo").onclick = showPair;
  $("#invgo").onclick = async () => {
    let r; try { r = await post("/api/invite"); } catch(err){ return toast(err.message); }
    $("#invbox").innerHTML = `<div class="field"><input id="invurl" readonly value="${esc(r.url)}" aria-label="${t.inviteH}">
      <button class="btn" id="invcopy">${ic("copy", 'style="width:16px;height:16px"')}${t.copyMd}</button></div><p class="hint">${t.inviteExp}</p>`;
    $("#invcopy").onclick = async () => { try { await navigator.clipboard.writeText(r.url); toast(t.copied); } catch { $("#invurl").select(); } };
  };
  $("#erase").onsubmit = async e => {
    e.preventDefault();
    if (!confirm(t.eraseP)) return;
    try { await post("/api/erase", {password: $("#erasepw").value}); location.replace("/"); }
    catch(err){ $("#eraseerr").textContent = err.message; }
  };
  renderDevices();
}

async function renderDevices(){
  const t = L(), box = $("#devs"); if (!box) return;
  const d = await api("/api/devices").catch(() => null); if (!d) return;
  const now = Date.now() / 1000;
  box.innerHTML = d.devices.map(x => `<div class="dev"><span class="kind">${ic(/iPhone|Android|iPad/.test(x.device) ? "phone" : "laptop")}</span>
    <div><b>${esc(x.device)}</b>${x.id === d.current ? ` <span class="chip ok" style="font-size:11px">${t.thisDev}</span>` : ""}
      <div class="sub">${now - x.seen < 120 ? `<span class="live"></span>` : ""}${t.lastSeen} ${t.ago(now - x.seen)} · ${t.via[x.via] || x.via}</div></div>
    ${x.id !== d.current ? `<button class="btn ghost small danger" data-revoke="${esc(x.id)}">${t.revoke}</button>` : "<span></span>"}</div>`).join("");
  box.querySelectorAll("[data-revoke]").forEach(b => b.onclick = async () => {
    if (!confirm(t.revokeQ)) return;
    await api("/api/devices/" + b.dataset.revoke, {method: "DELETE"}).catch(err => toast(err.message));
    renderDevices();
  });
}

let PAIRTIMER = null;
async function showPair(){
  const t = L(), box = $("#pairbox");
  clearInterval(PAIRTIMER);
  let p; try { p = await post("/api/pair"); } catch(err){ return toast(err.message); }
  if (!p.reachable){ box.innerHTML = `<p class="muted" style="margin:0">${t.connectLocal}</p>`; return; }
  box.innerHTML = `<div class="pairbox"><div id="qr"></div><div><p class="mono" style="word-break:break-all;font-size:12px;margin:0 0 8px">${esc(p.url)}</p>
    <p class="faint" id="pexp" style="margin:0 0 10px;font-size:13px"></p><button class="btn ghost small" id="pairnew">${t.connectNew}</button></div></div>`;
  loadQR(p.url);
  $("#pairnew").onclick = showPair;
  const until = Date.now() + p.expires_in * 1000;
  const tick = () => { const s = Math.round((until - Date.now()) / 1000), el = $("#pexp");
    if (!el) return clearInterval(PAIRTIMER);
    if (s <= 0){ clearInterval(PAIRTIMER); el.textContent = t.connectExpired; $("#qr").style.opacity = .15; }
    else el.textContent = t.connectExp(s); };
  tick(); PAIRTIMER = setInterval(tick, 1000);
}

function loadQR(url){
  const draw = () => { const el = $("#qr"); if (el && window.QRCode){ el.innerHTML = ""; new QRCode(el, {text: url, width: 180, height: 180});
    el.setAttribute("role", "img"); el.setAttribute("aria-label", "QR code: " + url); el.removeAttribute("title"); } };
  if (window.QRCode) return draw();
  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"; s.onload = draw;
  document.head.appendChild(s);
}

/* ------------------------------------------------------------- welcome (intro for new visitors and demos) */
async function welcomeScreen(){
  clearInterval(POLL); clearInterval(FEED);
  const t = L(), w = t.wl;
  document.title = "AgentReady · " + w.h1.replace(/<[^>]+>/g, "");
  document.body.innerHTML = `<div class="wl">
    <nav class="wl-nav" aria-label="Intro"><a class="mark" href="/" id="wl-home">${LOGO} AgentReady</a><span class="sp"></span>
      <button class="wl-ghost" id="wl-lang">${LANG === "ru" ? "English" : "Русский"}</button>
      <button class="wl-ghost hide-s" id="wl-skip">${w.skip}</button></nav>
    <main>
    <section class="wl-sec wl-hero">
      <span class="wl-kicker">${ic("robot", 'style="width:16px;height:16px"')}${w.kicker}</span>
      <h1>${w.h1}</h1>
      <p class="wl-lead">${w.lead}</p>
      <div class="wl-ctas"><button class="wl-cta" data-start>${w.start} ${ic("arrow")}</button>
        <a class="wl-ghost" id="wl-run" href="/" hidden style="padding:14px 22px;font-size:16px">${w.seeRun}</a></div>
      <div class="wl-proof" id="wl-proof" data-reveal ${AUTH?.accounts && !AUTH.user ? "hidden" : ""}><p style="margin:0;color:#8590A8">${w.noProof}</p></div>
    </section>
    <section class="wl-sec" data-reveal>
      <div class="wl-eyebrow">${w.probE}</div><h2 class="wl-h2">${w.probH}</h2><p class="wl-sub">${w.probS}</p>
      <div class="wl-cards">${w.prob.map(([i, h, p]) => `<div class="wl-card">${ic(i)}<h3>${h}</h3><p>${p}</p></div>`).join("")}</div>
    </section>
    <section class="wl-sec" data-reveal>
      <div class="wl-eyebrow">${w.howE}</div><h2 class="wl-h2">${w.howH}</h2><p class="wl-sub">${w.howS}</p>
      <div class="wl-steps">${w.how.map(([who, c, h, p]) => `<div class="wl-step"><span class="who ${c}">${who}</span><h3>${h}</h3><p>${p}</p></div>`).join("")}</div>
    </section>
    <section class="wl-sec" data-reveal><div class="wl-split">
      <div><div class="wl-eyebrow">${w.verE}</div><h2 class="wl-h2">${w.verH}</h2><p class="wl-sub">${w.verS}</p>
        <ul class="wl-list">${w.ver.map(x => `<li>${ic("check")}${x}</li>`).join("")}</ul>
        <button class="wl-cta" data-start="/verify">${ic("verify")}${w.verCta}</button></div>
      <div class="wl-code" aria-hidden="true">${[
        ["ok", "import requests"], ["bad", "import fastjsonx", 0], ["ok", ""], ["ok", "def load_prices(url):"], ["ok", "    try:"],
        ["ok", "        data = requests.get(url).text"], ["bad", "        return eval(data)", 1], ["bad", "    except:", 1],
        ["ok", "        return {}"], ["ok", ""], ["bad", 'API_KEY = "sk-live-4f9a…"', 2]]
        .map(([c, l, tag]) => `<div class="${c}">${esc(l) || " "}${tag != null ? `<span class="tag">${w.codeTags[tag]}</span>` : ""}</div>`).join("")}</div>
    </div></section>
    <section class="wl-sec" data-reveal>
      <div class="wl-eyebrow">${w.stackE}</div>
      <div class="wl-stack">${w.stack.map(([b, s]) => `<div class="wl-chip"><b>${b}</b><span>${s}</span></div>`).join("")}</div>
    </section>
    <section class="wl-sec wl-end" data-reveal>
      <h2 class="wl-h2" style="margin:0 auto 12px">${w.endH}</h2><p class="wl-sub" style="margin:0 auto 28px">${w.endS}</p>
      <button class="wl-cta" data-start>${w.start} ${ic("arrow")}</button>
    </section>
    </main>
    <div class="wl-foot">${w.foot}</div></div>`;
  const leave = to => { store.set("ar-welcomed", "1"); location.href = to || "/"; };
  document.querySelectorAll("[data-start]").forEach(b => b.onclick = () => leave(b.dataset.start));
  $("#wl-skip").onclick = () => leave("/");
  $("#wl-home").onclick = e => { e.preventDefault(); leave("/"); };
  $("#wl-lang").onclick = () => { LANG = LANG === "ru" ? "en" : "ru"; store.set("ar-lang", LANG); document.documentElement.lang = LANG; welcomeScreen(); };
  const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold: .12}) : null;
  document.querySelectorAll("[data-reveal]").forEach(el => io ? io.observe(el) : el.classList.add("in"));

async function welcomeProof(){
  // the hero shows a real finished run when this visitor may see runs; nothing invented when not
  if (AUTH?.accounts && !AUTH.user) return;  // signed out: no runs to show (and no 401 in the console)
  const get = async u => { const r = await fetch(u).catch(() => null); return r && r.ok ? r.json() : null; };
  const runs = await get("/api/runs"); const best = (runs || []).filter(r => r.status === "done" && r.score_after != null)
    .sort((a, b) => (b.score_after - b.score_before) - (a.score_after - a.score_before))[0];
  const run = best && await get("/api/runs/" + best.id); const box = $("#wl-proof"); if (!run || !box) return;
  const w = L().wl, eps = Object.values(run.episodes || {});
  const lanes = cond => eps.filter(e => e.condition === cond).sort((a, b) => a.key.localeCompare(b.key, undefined, {numeric: true})).slice(0, 6);
  let delay = 0;
  const lane = e => { const ticks = (e.steps || []).map(st => { delay += 0.025;
      return `<span class="tick ${esc(st.action)} ${st.ok ? "" : "fail"}" style="animation-delay:${delay.toFixed(2)}s"></span>`; }).join("");
    return `<div class="wl-lane"><span class="ticks">${ticks}</span><span class="v ${e.success ? "ok" : "no"}" style="animation-delay:${delay.toFixed(2)}s">${e.success ? w.ok : w.no}</span></div>`; };
  const m = run.metrics;
  box.innerHTML = `<div class="hd"><span class="big">${w.proofH}</span><span>${esc(w.proofSub(run.options.label || run.options.source, eps.length))}</span>
      <span class="score">${m.score_before} <span style="color:#5E6A80">→</span> <span class="a">${m.score_after}</span></span></div>
    <div class="wl-lanes"><div><h4><i class="swatch" style="background:#8C96AA"></i>${w.before}</h4>${lanes("baseline").map(lane).join("")}</div>
      <div><h4><i class="swatch" style="background:#8AA2FF"></i>${w.after}</h4>${lanes("improved").map(lane).join("")}</div></div>`;
  const a = $("#wl-run"); a.hidden = false; a.href = "/run/" + run.id;
  a.onclick = e => { e.preventDefault(); store.set("ar-welcomed", "1"); location.href = a.href; };
}

/* ------------------------------------------------------------- router + app */
function go(path){ history.pushState({}, "", path); route(); window.scrollTo(0, 0); $("#app")?.focus({preventScroll: true}); }
let ROUTE_N = 0, LAST_PATH = "";
function skeleton(){
  return `<div class="skel" style="height:150px;margin:18px 0"></div><div class="grid g2"><div class="skel" style="height:260px"></div><div class="skel" style="height:260px"></div></div>`;
}
function route(keepScroll){
  clearInterval(POLL);
  const p = location.pathname; let m;
  renderShell();
  // a new page that takes a moment to load shows a placeholder instead of the old page
  const app = $("#app"), n = ++ROUTE_N, before = app.innerHTML;
  if (p !== LAST_PATH) setTimeout(() => { if (n === ROUTE_N && app.innerHTML === before) app.innerHTML = skeleton(); }, 150);
  LAST_PATH = p;
  if ((m = p.match(/^\/run\/([\w-]+)/))) return runPage(m[1]);
  if ((m = p.match(/^\/verify\/([\w-]+)/))) return verifyResult(m[1]);
  if (p === "/verify") return verifyPage();
  if (p === "/history") return historyPage();
  if (p === "/stats") return statsPage();
  if (p === "/settings") return settingsPage();
  return tester();
}
/* ------------------------------------------------------------- command palette (Ctrl+K) */
let PAL = [], PALSEL = 0;
async function openPalette(){
  if (!ME && AUTH?.accounts) return;
  const t = L(), dlg = $("#pal"), q = $("#pal-q");
  q.placeholder = t.palPh; q.value = "";
  const pages = NAV.map(([href, key]) => ({href, icon: key, title: t.nav[key], sub: ""}));
  dlg.showModal(); drawPalette(pages);
  const [runs, vers] = await Promise.all([api("/api/runs").catch(() => []), api("/api/verify").catch(() => [])]);
  const items = pages.concat(merge(runs, vers).slice(0, 40).map(x => ({href: (x._type === "run" ? "/run/" : "/verify/") + x.id,
    icon: x._type === "run" ? "tester" : "verify", title: x.label || x.source,
    sub: `${x._type === "run" ? (x.score_after ?? "") : (x.score ?? "")} · ${when(x.created)}`})));
  const filter = () => { const s = q.value.trim().toLowerCase(); PALSEL = 0;
    drawPalette(s ? items.filter(i => (i.title + " " + i.href).toLowerCase().includes(s)) : items); };
  q.oninput = filter; filter();
}
function drawPalette(items){
  PAL = items;
  $("#pal-keys").innerHTML = matchMedia("(pointer:fine)").matches ? L().keys.map(k => `<span>${k}</span>`).join("") : "";
  $("#pal-list").innerHTML = items.map((i, k) => `<li role="option" data-k="${k}" aria-selected="${k === PALSEL}">${ic(i.icon)}<span class="t">${esc(i.title)}</span><span class="sub">${esc(i.sub)}</span></li>`).join("");
  $("#pal-list").querySelectorAll("li").forEach(li => li.onclick = () => pickPalette(+li.dataset.k));
}
function pickPalette(k){ const i = PAL[k]; if (!i) return; $("#pal").close(); go(i.href); }
$("#pal").addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault();
    PALSEL = (PALSEL + (e.key === "ArrowDown" ? 1 : -1) + PAL.length) % Math.max(1, PAL.length); drawPalette(PAL);
    $(`#pal-list li[data-k="${PALSEL}"]`)?.scrollIntoView({block: "nearest"}); }
  if (e.key === "Enter"){ e.preventDefault(); pickPalette(PALSEL); }
});
$("#pal").addEventListener("click", e => { if (e.target.id === "pal") $("#pal").close(); });  // click on the backdrop
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); $("#pal").open ? $("#pal").close() : openPalette(); }
});

/* ------------------------------------------------------------- keyboard (PC) */
let GPREFIX = 0;
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (typing || e.ctrlKey || e.metaKey || e.altKey || document.querySelector("dialog[open]") || !ME) return;
  const k = e.key.toLowerCase();
  if (Date.now() - GPREFIX < 1200){
    const to = {t: "/", v: "/verify", h: "/history", s: "/stats", ",": "/settings"}[k];
    GPREFIX = 0; if (to){ e.preventDefault(); go(to); } return;
  }
  if (k === "g"){ GPREFIX = Date.now(); return; }
  if (k === "n"){ e.preventDefault(); go("/?focus=1"); return; }
  if (k === "/"){ const f = $("#hq, #src, #vsrc"); if (f){ e.preventDefault(); f.focus(); } return; }
  if (k === "?"){ e.preventDefault(); openPalette(); }
});

/* ------------------------------------------------------------- app lifecycle: offline, resume, icon badge */
function setOffline(off){
  document.body.classList.toggle("offline", off);
  $("#offbar").textContent = off ? L().offlineBar : "";
}
addEventListener("offline", () => setOffline(true));
addEventListener("online", () => { setOffline(false); toast(L().backOnline); pollFeed(); refreshList(); });
// a phone app that comes back from the background shows fresh results, not the ones from when it was hidden
document.addEventListener("visibilitychange", () => { if (!document.hidden && ME){ pollFeed(); refreshList(); updateBadge(); } });
function refreshList(){
  // pages with only results: safe to redraw; never pages with a form the user may be typing in
  if (["/history", "/stats"].includes(location.pathname)) route(true);
  else if (location.pathname.startsWith("/run/") && RUN && !["queued", "running"].includes(RUN.status)) runPage(RUN.id);
}
// number of runs in progress on the app icon (installed app on PC, Android, iOS 16.4+)
async function updateBadge(){
  if (!("setAppBadge" in navigator) || !ME) return;
  const runs = await api("/api/runs").catch(() => null); if (!runs) return;
  const n = runs.filter(r => ["queued", "running"].includes(r.status)).length;
  (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {});
}

window.onpopstate = () => route();
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); INSTALL = e; });
window.addEventListener("appinstalled", () => { INSTALL = null; });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
document.documentElement.lang = LANG;
(async () => {
  [HEALTH, AUTH] = await Promise.all([api("/api/health").catch(() => null), api("/api/auth/status").catch(() => null)]);
  const code = new URLSearchParams(location.search).get("code");
  if (location.pathname === "/welcome" || (location.pathname === "/" && !store.get("ar-welcomed") && !location.search)) return welcomeScreen();
  if (location.pathname === "/pair" && code && AUTH?.accounts) return pairScreen(code);
  if (AUTH?.accounts && !AUTH.user) return location.pathname === "/join" ? authScreen("signup", code) : authScreen();
  if (AUTH?.user){ ME = {user: AUTH.user, device_id: AUTH.device_id, device: AUTH.device};
    if (["/login", "/pair", "/join"].includes(location.pathname)) history.replaceState({}, "", "/");
    pollFeed(); FEED = setInterval(pollFeed, 4000); updateBadge(); }
  if (!navigator.onLine) setOffline(true);
  route();
})();
</script>
